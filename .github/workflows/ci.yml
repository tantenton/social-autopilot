name: CI

on:
  push:
    branches: [ master, main, fix/* ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/social_autopilot_test?schema=public"
      REDIS_URL: "redis://localhost:6379"
      NEXTAUTH_SECRET: "ci-secret-key-placeholder-32-chars-long"
      GEMINI_API_KEY: "ci-gemini-key-placeholder"
      FAL_KEY: "ci-fal-key-placeholder"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Run build
        run: pnpm build
